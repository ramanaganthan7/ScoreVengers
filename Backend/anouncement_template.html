<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Notification</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f4; color: #333;">
  <h1 style="color: #2a7b7b;">📢 Exam Announcement</h1>
  <p style="font-size: 18px; font-weight: bold; color: #555;">
    <strong>Test Name:</strong> {{TEST_NAME}}
  </p>
  <p style="font-size: 18px; font-weight: bold; color: #555;">
    <strong>Date:</strong> {{DATE}}
  </p>
  <p style="font-size: 18px; font-weight: bold; color: #555;">
    <strong>Staff Conducting:</strong> {{STAFF_NAME}}
  </p>
  <p style="font-size: 18px; font-weight: bold; color: #555;">
    <strong>Mode of Exam:</strong> {{EXAM_MODE}}
  </p>
  <p style="font-size: 16px; color: #777;">
    This is an automated notification for your upcoming exam. Please be prepared accordingly.
  </p>
</body>
</html>
