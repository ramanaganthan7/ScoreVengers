<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

    <table cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #ffffff; border-radius: 10px; overflow: hidden; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        <tr>
            <td style="background-color: #4a90e2; padding: 20px; text-align: center;">
                <h1 style="color: #ffffff; margin: 0;">📢 GATE MOCK TEST Result Notification</h1>

        </tr>
        <tr>
            <td style="padding: 20px;">
                <p style="font-size: 18px; font-weight: bold; color: #555; margin-bottom: 10px;">
                    <strong>Test Name:</strong> {{TEST_NAME}}
                </p>
                <p style="font-size: 18px; font-weight: bold; color: #555; margin-bottom: 20px;">
                    <strong>Date:</strong> {{DATE}}
                </p>
                <p style="font-size: 16px; color: #777; margin-bottom: 10px;">
                    This is an automated email notification.
                </p>
                <p style="font-size: 16px; color: #777; margin-bottom: 20px;">

                </p>
            </td>
        </tr>
        <tr>
            <td style="background-color: #4a90e2; color: #ffffff; text-align: center; padding: 10px; font-size: 12px;">
                © 2025 ScoreVengers. All rights reserved.
            </td>
        </tr>
    </table>
